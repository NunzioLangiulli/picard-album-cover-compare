long_description = "Album Cover Compare 1.0.1 by Borunzio. Click an album cover to compare embedded, local, Picard and CAA images side by side. Drop local images, inspect original dimensions, format and size, open an Album Art Exchange browser search, and apply a front cover to the album. Save in Picard when ready; native preservation settings still apply. Independent of Cover Art From Hidden Tags. Target: Picard 3.0.2."
